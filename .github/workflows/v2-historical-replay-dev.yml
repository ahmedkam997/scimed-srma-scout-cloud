name: v2-historical-replay-dev
on:
  workflow_dispatch:
  pull_request:
    branches: [scientific-verification-v2-phase1]
    paths:
      - 'scripts/v2_historical_replay_dev.py'
      - 'tests/test_historical_replay_dev.py'
      - '.github/workflows/v2-historical-replay-dev.yml'
  push:
    branches: [scientific-verification-v2-phase3-replay]
    paths:
      - 'scripts/v2_historical_replay_dev.py'
      - 'tests/test_historical_replay_dev.py'
      - '.github/workflows/v2-historical-replay-dev.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_historical_replay_dev.py
      - run: python scripts/v2_historical_replay_dev.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v2-historical-replay-dev
          path: v2-replay-dev.json
