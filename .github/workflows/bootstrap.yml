name: Bootstrap SciMed Scout v0.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract bootstrap package
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="scimed-srma-scout-cloud-v0.1-clean.zip"
          test -f "$ARCHIVE"
          rm -rf .bootstrap
          mkdir .bootstrap
          unzip -oq "$ARCHIVE" -d .bootstrap
          cp -a .bootstrap/. .
          rm -rf .bootstrap "$ARCHIVE"

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Run health check
        run: python -m scimed_scout.cli health

      - name: Commit bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "bootstrap SciMed SRMA Scout Cloud v0.1"
          git push
