name: recover-current-discovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-current-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  trigger-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Dispatch current version of discovery-worker for queued job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run discovery-worker.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Requested current discovery-worker on main. No new discovery job was created."
