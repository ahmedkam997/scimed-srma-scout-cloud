name: verify-dispatch-groq

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-dispatch-groq.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify owner-scoped dispatch path without starting a job
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.error, pathlib
          s=pathlib.Path("web/config.js").read_text()
          public_key=re.search(r'supabaseAnonKey:\s*"([^"]+)"',s).group(1)
          endpoint="https://vskqiszpjxsmcayuaclo.supabase.co/functions/v1/wake-discovery-worker"
          # Intentionally impossible job UUID. No GitHub run is dispatched.
          body=json.dumps({"job_id":"a1123456-1234-4123-8123-123456789abc"}).encode()
          req=urllib.request.Request(endpoint,data=body,method="POST",headers={
            "apikey":public_key, "Authorization":"Bearer "+public_key,
            "x-scimed-client-token":"a"*64,
            "Origin":"https://ahmedkam997.github.io",
            "Content-Type":"application/json"})
          try:
            with urllib.request.urlopen(req,timeout=20) as res:
              data=json.load(res)
              print("EDGE_DISPATCH_HTTP",res.status,"STATUS",str(data.get("status"))[:100],flush=True)
              assert res.status==202 and data.get("status")=="already_requested_or_not_queued"
          except urllib.error.HTTPError as err:
            try: data=json.loads(err.read(800))
            except Exception: data={}
            print("EDGE_DISPATCH_HTTP",err.code,"STATUS",str(data.get("status"))[:90],
                  "DB_HTTP",str(data.get("db_http"))[:8],
                  "DB_CODE",str(data.get("db_code"))[:25],flush=True)
            raise
          print("EDGE_DISPATCH_FAKE_JOB_TEST_PASS",flush=True)
          PY
      - name: Diagnose Groq block class by request headers
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          key=os.getenv("GROQ_API_KEY") or ""
          if not key:
            print("GROQ_KEY_MISSING",flush=True)
            raise SystemExit(0)
          ua_items=[
            ("scimed","SciMed-Review-Scout/1.0"),
            ("browser","Mozilla/5.0 (compatible; SciMedResearch/1.0)"),
            ("curl","curl/8.6.0"),
          ]
          for label,ua in ua_items:
            request=urllib.request.Request(
              "https://api.groq.com/openai/v1/models",
              headers={"Authorization":"Bearer "+key,
                       "User-Agent":ua,
                       "Accept":"application/json"})
            try:
              with urllib.request.urlopen(request,timeout=15) as resp:
                data=json.load(resp)
                print("GROQ_UA",label,"HTTP",resp.status,
                      "MODELS",len(data.get("data",[])),flush=True)
            except urllib.error.HTTPError as exc:
              content_type=str(exc.headers.get("content-type") or "")
              data=exc.read(1500)
              text=data.decode("utf8","ignore").lower()
              signals={
                "HTML": ("<!doctype html" in text or "<html" in text),
                "CLOUDFLARE": ("cloudflare" in text or "error 1010" in text),
                "REGION": any(w in text for w in ("country","region","location","geograph")),
                "PERMISSION": any(w in text for w in ("permission","organization","project","forbidden")),
                "NOT_JSON": ("json" not in content_type),
              }
              print("GROQ_UA",label,"HTTP",exc.code,
                    "CONTENT_TYPE",content_type[:35],
                    "BLOCK_SIGNALS",",".join(k for k,v in signals.items() if v) or "NONE",
                    flush=True)
            except Exception as exc:
              print("GROQ_UA",label,"EXCEPTION",type(exc).__name__,flush=True)
          PY
      - name: Verify one real Groq completion with corrected client headers
        run: |
          python -m pip install -e . --quiet
          python - <<'PY'
          import json,os,urllib.error
          from scimed_scout.ai.models import AIRequest
          from scimed_scout.ai.providers import OpenAICompatibleProvider,ProviderFailure
          key=os.getenv("GROQ_API_KEY","")
          if not key:
            print("GROQ_COMPLETION NOT_CONFIGURED",flush=True)
            raise SystemExit(0)
          api=OpenAICompatibleProvider(
            endpoint="https://api.groq.com/openai/v1/chat/completions",
            model="openai/gpt-oss-20b",
            api_key=key,
            timeout=30.0,
            empty_retries=1,
            name="groq-live-check",
          )
          try:
            out=api.complete(AIRequest(
              system="Respond only with a compact JSON object.",
              prompt="Return the JSON object with key ok and boolean true.",
              temperature=0,
              max_tokens=1100,
            ))
            payload=json.loads(out.text)
            print("GROQ_COMPLETION_HTTP_200",True,
              "VALID_JSON",isinstance(payload,dict),
              "OK",payload.get("ok") is True,
              "MODEL",out.model[:60],flush=True)
            assert payload.get("ok") is True
          except ProviderFailure as exc:
            print("GROQ_COMPLETION_ERROR",exc.status_code,flush=True)
            raise
          PY
