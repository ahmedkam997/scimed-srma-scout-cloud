name: verify-dispatch-groq

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-dispatch-groq.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify owner-scoped dispatch path without starting a job
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.error, pathlib
          s=pathlib.Path("web/config.js").read_text()
          public_key=re.search(r'supabaseAnonKey:\s*"([^"]+)"',s).group(1)
          endpoint="https://vskqiszpjxsmcayuaclo.supabase.co/functions/v1/wake-discovery-worker"
          # Intentionally impossible job UUID. No GitHub run is dispatched.
          body=json.dumps({"job_id":"a1123456-1234-4123-8123-123456789abc"}).encode()
          req=urllib.request.Request(endpoint,data=body,method="POST",headers={
            "apikey":public_key, "Authorization":"Bearer "+public_key,
            "x-scimed-client-token":"a"*64,
            "Origin":"https://ahmedkam997.github.io",
            "Content-Type":"application/json"})
          try:
            with urllib.request.urlopen(req,timeout=20) as res:
              data=json.load(res)
              print("EDGE_DISPATCH_HTTP",res.status,"STATUS",str(data.get("status"))[:100],flush=True)
              assert res.status==202 and data.get("status")=="already_requested_or_not_queued"
          except urllib.error.HTTPError as err:
            try: data=json.loads(err.read(800))
            except Exception: data={}
            print("EDGE_DISPATCH_HTTP",err.code,"STATUS",str(data.get("status"))[:90],
                  "DB_HTTP",str(data.get("db_http"))[:8],
                  "DB_CODE",str(data.get("db_code"))[:25],flush=True)
            raise
          print("EDGE_DISPATCH_FAKE_JOB_TEST_PASS",flush=True)
          PY
      - name: Diagnose Groq block class by request headers
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          key=os.getenv("GROQ_API_KEY") or ""
          if not key:
            print("GROQ_KEY_MISSING",flush=True)
            raise SystemExit(0)
          ua_items=[
            ("scimed","SciMed-Review-Scout/1.0"),
            ("browser","Mozilla/5.0 (compatible; SciMedResearch/1.0)"),
            ("curl","curl/8.6.0"),
          ]
          for label,ua in ua_items:
            request=urllib.request.Request(
              "https://api.groq.com/openai/v1/models",
              headers={"Authorization":"Bearer "+key,
                       "User-Agent":ua,
                       "Accept":"application/json"})
            try:
              with urllib.request.urlopen(request,timeout=15) as resp:
                data=json.load(resp)
                print("GROQ_UA",label,"HTTP",resp.status,
                      "MODELS",len(data.get("data",[])),flush=True)
            except urllib.error.HTTPError as exc:
              content_type=str(exc.headers.get("content-type") or "")
              data=exc.read(1500)
              text=data.decode("utf8","ignore").lower()
              signals={
                "HTML": ("<!doctype html" in text or "<html" in text),
                "CLOUDFLARE": ("cloudflare" in text or "error 1010" in text),
                "REGION": any(w in text for w in ("country","region","location","geograph")),
                "PERMISSION": any(w in text for w in ("permission","organization","project","forbidden")),
                "NOT_JSON": ("json" not in content_type),
              }
              print("GROQ_UA",label,"HTTP",exc.code,
                    "CONTENT_TYPE",content_type[:35],
                    "BLOCK_SIGNALS",",".join(k for k,v in signals.items() if v) or "NONE",
                    flush=True)
            except Exception as exc:
              print("GROQ_UA",label,"EXCEPTION",type(exc).__name__,flush=True)
          PY
      - name: Verify one real Groq completion with corrected client headers
        run: |
          python -m pip install -e . --quiet
          python - <<'PY'
          import json,os,urllib.error
          from scimed_scout.ai.models import AIRequest
          from scimed_scout.ai.providers import OpenAICompatibleProvider,ProviderFailure
          key=os.getenv("GROQ_API_KEY","")
          if not key:
            print("GROQ_COMPLETION NOT_CONFIGURED",flush=True)
            raise SystemExit(0)
          api=OpenAICompatibleProvider(
            endpoint="https://api.groq.com/openai/v1/chat/completions",
            model="openai/gpt-oss-20b",
            api_key=key,
            timeout=30.0,
            empty_retries=1,
            name="groq-live-check",
          )
          try:
            out=api.complete(AIRequest(
              system="Respond only with a compact JSON object.",
              prompt="Return the JSON object with key ok and boolean true.",
              temperature=0,
              max_tokens=1100,
            ))
            payload=json.loads(out.text)
            print("GROQ_COMPLETION_HTTP_200",True,
              "VALID_JSON",isinstance(payload,dict),
              "OK",payload.get("ok") is True,
              "MODEL",out.model[:60],flush=True)
            assert payload.get("ok") is True
          except ProviderFailure as exc:
            print("GROQ_COMPLETION_ERROR",exc.status_code,flush=True)
            raise
          PY
      - name: End-to-end GitHub dispatch smoke with immediately cancelled test job
        run: |
          python - <<'PY'
          import json,re,secrets,urllib.request,urllib.error,pathlib
          config=pathlib.Path("web/config.js").read_text()
          public_key=re.search(r'supabaseAnonKey:\s*"([^"]+)"',config).group(1)
          token=secrets.token_hex(32)
          base="https://vskqiszpjxsmcayuaclo.supabase.co"
          db_headers={
            "apikey":public_key, "Authorization":"Bearer "+public_key,
            "x-scimed-client-token":token, "Content-Type":"application/json",
          }
          job_id=None
          def post(url, data, headers):
            req=urllib.request.Request(url,data=json.dumps(data).encode(),headers=headers,method="POST")
            try:
              with urllib.request.urlopen(req,timeout=20) as response:
                return response.status,json.load(response)
            except urllib.error.HTTPError as err:
              try: payload=json.loads(err.read(700))
              except Exception: payload={}
              return err.code,payload
          try:
            code,created=post(base+"/rest/v1/discovery_jobs",{
              "specialty":"SCIMED_DISPATCH_TEST_ONLY",
              "question_type":"ALL",
            },{**db_headers,"Prefer":"return=representation"})
            assert code in (200,201) and isinstance(created,list) and len(created)==1, "test insert failed"
            job_id=created[0]["id"]
            code,body=post(base+"/functions/v1/wake-discovery-worker",{
              "job_id":job_id
            },{**db_headers,"Origin":"https://ahmedkam997.github.io"})
            print("EDGE_REAL_DISPATCH_HTTP",code,
              "RESULT",str(body.get("status") or "")[:50],
              "GITHUB_HTTP",str(body.get("github_status") or "")[:6],flush=True)
            assert code==202 and body.get("status")=="dispatched", "GitHub did not accept the dispatch"
          finally:
            if job_id:
              code,body=post(base+"/rest/v1/rpc/scimed_cancel_job",{
                "p_job_id":job_id
              },db_headers)
              print("DISPATCH_TEST_JOB_CANCEL",code,"CANCELLED",body is True,flush=True)
          PY
      - name: Diagnose actual Cardiology topic-generation prompt on Groq
        run: |
          python -m pip install -e . --quiet
          python - <<'PY'
          import os,json
          from scimed_scout.ai.discovery import build_discovery_prompt,parse_candidate_proposals
          from scimed_scout.ai.providers import OpenAICompatibleProvider
          from scimed_scout.ai.models import AIRequest
          from scimed_scout.ai.discovery import SYSTEM_PROMPT
          key=os.getenv("GROQ_API_KEY","")
          if not key:
            print("GROQ_PROMPT NOT_CONFIGURED")
            raise SystemExit(0)
          provider=OpenAICompatibleProvider(
            endpoint="https://api.groq.com/openai/v1/chat/completions",
            model="openai/gpt-oss-20b",api_key=key,
            empty_retries=1,name="groq-diagnostic",timeout=30)
          prompt=build_discovery_prompt(specialty="Cardiology",count=4,
            additional_context="Recent study evidence indicates subgroups of heart failure and cardiovascular therapeutics, with heterogeneous populations. Identify narrow clinically meaningful PICO alternatives.")
          try:
            response=provider.complete(AIRequest(system=SYSTEM_PROMPT,prompt=prompt,max_tokens=2200))
            data=response.raw
            usage=data.get("usage") or {}
            details=usage.get("completion_tokens_details") or {}
            first=(data.get("choices") or [{}])[0]
            print("CARDIO_PROMPT HTTP_200",True,
              "TEXT_LENGTH",len(response.text),
              "FINISH_REASON",str(first.get("finish_reason"))[:40],
              "COMPLETION_TOKENS",usage.get("completion_tokens"),
              "REASONING_TOKENS",details.get("reasoning_tokens"),flush=True)
            try:
              proposals=parse_candidate_proposals(response.text)
              print("CARDIO_PROMPT VALID_PROPOSALS",len(proposals),flush=True)
            except Exception as ex:
              print("CARDIO_PROMPT PARSE_ERROR",type(ex).__name__,flush=True)
          except Exception as exc:
            print("CARDIO_PROMPT PROVIDER_ERROR",type(exc).__name__,str(getattr(exc,"status_code",""))[:5],flush=True)
          PY
