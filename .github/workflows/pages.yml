name: pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: scimed-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Wait for GitHub Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              | jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" = "1" ]; then
              echo "GitHub Pages artifact indexed."
              sleep 10
              exit 0
            fi
            echo "Artifact not indexed yet (attempt $attempt); retrying."
            sleep 5
          done
          echo "::error::Expected exactly one github-pages artifact in this workflow run."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
