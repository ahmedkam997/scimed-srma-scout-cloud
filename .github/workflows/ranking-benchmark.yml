name: ranking-benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ranking-benchmark.yml'
      - 'src/scimed_scout/discovery/ranking_benchmark.py'
      - 'src/scimed_scout/sources/pubmed.py'
      - 'benchmarks/ranking_v3.json'
permissions:
  contents: read
jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_pubmed_mixed.py
      - run: python -m scimed_scout.discovery.ranking_benchmark --output ranking-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranking-report
          path: ranking-report.json
