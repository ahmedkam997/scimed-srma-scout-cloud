name: adaptive-retrieval
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adaptive-retrieval.yml'
      - 'src/scimed_scout/discovery/adaptive_retrieval*.py'
      - 'src/scimed_scout/discovery/focused_queries.py'
permissions:
  contents: read
jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_adaptive_retrieval.py
      - run: python -m scimed_scout.discovery.adaptive_retrieval_benchmark --output adaptive-retrieval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-retrieval
          path: adaptive-retrieval.json
