name: scimed-autonomous-worker-validation
on:
  push:
    branches: [autonomous-worker-v1]
    paths:
      - 'scripts/scimed_autonomous_worker.py'
      - 'tests/test_autonomous_worker.py'
      - '.github/workflows/autonomous-worker-validation.yml'
  pull_request:
    branches: [scientific-verification-v2-phase3-replay]
    paths:
      - 'scripts/scimed_autonomous_worker.py'
      - 'tests/test_autonomous_worker.py'
      - '.github/workflows/autonomous-worker-validation.yml'
permissions:
  contents: read
concurrency:
  group: scimed-worker-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_autonomous_worker.py
      - name: Bounded live discovery and evidence checkpoint
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
        run: python -m scripts.scimed_autonomous_worker
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: scimed-worker-validation-state
          path: worker-output/
          retention-days: 14
