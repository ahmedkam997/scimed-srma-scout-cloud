name: Creative discovery validation
on:
  pull_request:
    branches: [autonomous-scientist-v10]
permissions:
  contents: read
concurrency:
  group: creative-discovery-validation
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_creative_discovery_memory.py tests/test_autonomous_worker.py tests/test_autonomous_worker_v2.py tests/test_autonomous_scientist.py
      - name: Live dynamic discovery in two specialties
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.scimed_autonomous_worker import initial,run,triage_public
          from scimed_scout.discovery.rct_first import collect
          s=initial()
          out=Path("creative-discovery-output");out.mkdir()
          for i in range(2):
              report,raw=run(s,collect,triage_public)
              dynamic=raw.get("dynamic_discovery",{})
              summary={"specialty":report["specialty"],"coverage":report["coverage"],
                  "dynamic_requested":report["dynamic_requested"],"dynamic_status":dynamic.get("status"),
                  "dynamic_diagnostic":dynamic.get("diagnostic"),"new_anchors":dynamic.get("anchors",[]),
                  "candidate_count":len(report["candidates"]),"candidate_leads":report["candidates"],
                  "qualification_granted":False}
              print("CREATIVE_RESULT",json.dumps(summary),flush=True)
              (out/f"specialty-{i}.json").write_text(json.dumps({"summary":summary,"source_evidence":raw},default=str))
              assert report["dynamic_requested"] and not report["qualification_granted"]
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: public-dynamic-discovery-validation
          path: creative-discovery-output/
          retention-days: 7
