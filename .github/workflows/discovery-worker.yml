name: discovery-worker
# Targeted recheck launch verification: source-only queue remains separate from AI discovery.
# Trigger controlled verification of the queued Cardiology job after competitor/coverage fixes.
# One controlled Cardiology follow-up after the live OSF index-response and source-ranked review fixes.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discovery-worker.yml'
      - 'src/scimed_scout/cloud/supabase.py'
      - 'src/scimed_scout/cloud/worker.py'
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [scimed-discovery-queued, scimed-recheck-queued]

permissions:
  contents: read

concurrency:
  group: scimed-discovery-worker
  cancel-in-progress: false

jobs:
  run-one-job:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: https://vskqiszpjxsmcayuaclo.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZza3Fpc3pwanhzbWNheXVhY2xvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzNzY3MzQsImV4cCI6MjExMDk1MjczNH0.ussaGLgCbu_J15GCEe3VGiLuCurV65xsyEjgxoHBfHs
      SCIMED_WORKER_TOKEN: ${{ secrets.SCIMED_WORKER_TOKEN }}
      SCIMED_AI_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
      SCIMED_AI_MODEL: openrouter/free
      SCIMED_AI_API_KEY: ${{ secrets.SCIMED_AI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} # Optional, independent free-plan quota
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Google AI Studio, kept in Actions secrets
      GEMINI_FREE_MODEL: gemini-3.5-flash-lite # Free-only model allowlisted in code
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }} # Optional free account key, server-side only
      PROSPERO_NETWORK_MODE: online

    steps:
      - name: Check worker configuration
        id: config
        run: |
          if [ -z "$SCIMED_WORKER_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Worker token is missing."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check discovery and source recheck queues
        if: steps.config.outputs.ready == 'true'
        id: queue
        run: |
          AUTH=(-H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "x-scimed-worker-token: $SCIMED_WORKER_TOKEN")
          RECHECK=$(curl --fail --silent --show-error "${AUTH[@]}" "$SUPABASE_URL/rest/v1/scimed_source_rechecks?select=id&status=eq.QUEUED&order=created_at.asc&limit=1")
          DISCOVERY=$(curl --fail --silent --show-error "${AUTH[@]}" "$SUPABASE_URL/rest/v1/discovery_jobs?select=id&status=eq.QUEUED&order=created_at.asc&limit=1")
          if [ "$RECHECK" != "[]" ]; then
            echo "has_job=true" >> "$GITHUB_OUTPUT"
            echo "kind=recheck" >> "$GITHUB_OUTPUT"
          elif [ "$DISCOVERY" != "[]" ]; then
            if [ -z "$SCIMED_AI_API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ -z "$GROQ_API_KEY" ]; then
              echo "has_job=false" >> "$GITHUB_OUTPUT"
              echo "No AI provider key configured for the discovery queue."
            else
              echo "has_job=true" >> "$GITHUB_OUTPUT"
              echo "kind=discovery" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_job=false" >> "$GITHUB_OUTPUT"
            echo "No queued work."
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true' && steps.queue.outputs.has_job == 'true'

      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true' && steps.queue.outputs.has_job == 'true'
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true' && steps.queue.outputs.has_job == 'true'
        with:
          node-version: '22'

      - name: Install SciMed Review Scout
        if: steps.config.outputs.ready == 'true' && steps.queue.outputs.has_job == 'true'
        run: python -m pip install -e .

      - name: Install read-only PROSPERO CLI
        if: steps.config.outputs.ready == 'true' && steps.queue.outputs.has_job == 'true'
        run: |
          git clone --depth 1 --branch v0.2.2 https://github.com/erichuang777777/PROSPERO-MCP.git "$RUNNER_TEMP/prospero-mcp"
          npm install --prefix "$RUNNER_TEMP/prospero-mcp" --no-audit --no-fund
          npm run build --prefix "$RUNNER_TEMP/prospero-mcp"
          test -s "$RUNNER_TEMP/prospero-mcp/dist/cli.js"
          echo "PROSPERO_CLI_JS=$RUNNER_TEMP/prospero-mcp/dist/cli.js" >> "$GITHUB_ENV"

      - name: Process next queued discovery job
        if: steps.config.outputs.ready == 'true' && steps.queue.outputs.has_job == 'true' && steps.queue.outputs.kind == 'discovery'
        run: python -m scimed_scout.cloud.worker

      - name: Recheck failed sources for one saved PICO without AI
        if: steps.config.outputs.ready == 'true' && steps.queue.outputs.has_job == 'true' && steps.queue.outputs.kind == 'recheck'
        run: python -m scimed_scout.cloud.source_recheck
