name: verify-current-config

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-current-config.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Test secret configuration without printing values or creating jobs
        run: |
          python - <<'PY'
          import json, os, re, urllib.request, urllib.error
          key=os.environ.get("GROQ_API_KEY","")
          print("GROQ_KEY_CONFIGURED",bool(key),flush=True)
          if key:
              url="https://api.groq.com/openai/v1/models"
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+key,"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=15) as resp:
                      obj=json.load(resp)
                      print("GROQ_HTTP",resp.status,"TARGET_MODEL_LISTED",any(
                          isinstance(v,dict) and v.get("id")=="openai/gpt-oss-20b"
                          for v in obj.get("data",[])),flush=True)
              except urllib.error.HTTPError as e:
                  safe_type="UNCLASSIFIED"
                  safe_code="unspecified"
                  try:
                      data=json.loads(e.read(2200))
                      error=data.get("error") or {}
                      msg=str(error.get("message") or "").casefold()
                      raw_code=str(error.get("code") or "")
                      if raw_code.isascii() and all(c.isalnum() or c in "_-" for c in raw_code):
                          safe_code=raw_code[:64]
                      if any(w in msg for w in ("country","region","territory","geographic")): safe_type="REGION_LIMIT"
                      elif any(w in msg for w in ("token","api key","unauthorized","invalid key")): safe_type="AUTH_LIMIT"
                      elif any(w in msg for w in ("model","decommissioned","not found")): safe_type="MODEL_LIMIT"
                      elif any(w in msg for w in ("permission","access denied","not allowed","forbidden")): safe_type="PERMISSION_LIMIT"
                      elif any(w in msg for w in ("quota","rate limit","limit reached")): safe_type="QUOTA_LIMIT"
                      elif msg: safe_type="OTHER_PROVIDER_RESTRICTION"
                  except Exception:
                      safe_type="NON_JSON_HTTP_REJECTION"
                  print("GROQ_HTTP",e.code,"ERROR_CLASS",safe_type,"ERROR_CODE",safe_code,flush=True)
              except Exception as exc:
                  print("GROQ_EXCEPTION",type(exc).__name__,flush=True)
          yaml=open(".github/workflows/discovery-worker.yml",encoding="utf-8").read()
          match=re.search(r"SUPABASE_ANON_KEY:\s*(eyJ[A-Za-z0-9_.-]+)",yaml)
          if not match:
              print("SUPABASE_PROBE","ANON_KEY_NOT_FOUND",flush=True)
          else:
              anon=match.group(1)
              url="https://vskqiszpjxsmcayuaclo.supabase.co/functions/v1/wake-discovery-worker"
              payload={"job_id":"00000000-0000-4000-8000-000000000001"}
              req=urllib.request.Request(url,data=json.dumps(payload).encode(),method="POST",
                headers={"apikey":anon,"Authorization":"Bearer "+anon,
                         "Content-Type":"application/json","x-scimed-client-token":"a"*64})
              try:
                  with urllib.request.urlopen(req,timeout=18) as res:
                      obj=json.load(res)
                      print("DISPATCH_FUNCTION_HTTP",res.status,
                            "DISPATCH_FUNCTION_STATUS",str(obj.get("status","unknown"))[:70],flush=True)
              except urllib.error.HTTPError as e:
                  try: obj=json.loads(e.read(1200))
                  except Exception:obj={}
                  print("DISPATCH_FUNCTION_HTTP",e.code,
                        "DISPATCH_FUNCTION_STATUS",str(obj.get("status","unknown"))[:70],flush=True)
              except Exception as exc:
                  print("DISPATCH_FUNCTION_EXCEPTION",type(exc).__name__,flush=True)
          PY
