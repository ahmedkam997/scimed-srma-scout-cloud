name: verify-ai-secret

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-ai-secret.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify OpenRouter free inference
        env:
          SCIMED_AI_API_KEY: ${{ secrets.SCIMED_AI_API_KEY }}
        run: |
          if [ -z "$SCIMED_AI_API_KEY" ]; then
            echo "SCIMED_AI_API_KEY is missing"
            exit 1
          fi

          HTTP_CODE=$(curl --silent --show-error             --output /tmp/openrouter.json             --write-out "%{http_code}"             https://openrouter.ai/api/v1/chat/completions             -H "Authorization: Bearer $SCIMED_AI_API_KEY"             -H "Content-Type: application/json"             -d '{"model":"openrouter/free","messages":[{"role":"user","content":"Reply with exactly OK"}],"max_tokens":8}')

          echo "OPENROUTER_HTTP=$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          try:
              data=json.loads(Path("/tmp/openrouter.json").read_text())
              print("OPENROUTER_ERROR=" + str(data.get("error",{}).get("message","request failed"))[:300])
          except Exception:
              print("OPENROUTER_ERROR=request failed")
          PY
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/openrouter.json").read_text())
          print("OPENROUTER_MODEL=" + str(data.get("model","unknown")))
          content=((data.get("choices") or [{}])[0].get("message") or {}).get("content","")
          print("OPENROUTER_RESPONSE_OK=" + str(bool(content.strip())))
          PY
