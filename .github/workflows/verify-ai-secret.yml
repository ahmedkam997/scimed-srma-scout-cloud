name: verify-ai-secret

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-ai-secret.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Verify real candidate generation
        env:
          SCIMED_AI_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          SCIMED_AI_MODEL: openrouter/free
          SCIMED_AI_API_KEY: ${{ secrets.SCIMED_AI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path

          from scimed_scout.ai import CandidateDiscoveryService, OpenAICompatibleProvider
          from scimed_scout.storage import ProjectRecord, SQLiteLedger

          if not os.getenv("SCIMED_AI_API_KEY"):
              raise SystemExit("SCIMED_AI_API_KEY is missing")

          with tempfile.TemporaryDirectory() as tmp:
              with SQLiteLedger(Path(tmp) / "test.sqlite3") as ledger:
                  ledger.upsert_project(ProjectRecord("AI-TEST", "Neurology", question_type="PROGNOSIS"))
                  service = CandidateDiscoveryService(OpenAICompatibleProvider.from_env(), ledger)
                  records = service.generate_and_store(
                      project_id="AI-TEST",
                      specialty="Neurology",
                      question_types=["PROGNOSIS"],
                      count=1,
                  )
                  if not records:
                      raise SystemExit("No candidate returned")
                  item = records[0]
                  print("AI_CANDIDATE_GENERATION=OK")
                  print("AI_RETURNED_QUESTION_TYPE=" + item.question_type)
                  print("AI_RETURNED_TITLE_LENGTH=" + str(len(item.title)))
          PY
