name: source-health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-health.yml'
      - 'scripts/source_health.py'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: scimed-source-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      PROSPERO_NETWORK_MODE: online
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install core package
        run: python -m pip install -e .
      - name: Install pinned PROSPERO-MCP read-only CLI
        run: |
          git clone --depth 1 --branch v0.2.2 https://github.com/erichuang777777/PROSPERO-MCP.git "$RUNNER_TEMP/prospero-mcp"
          npm install --prefix "$RUNNER_TEMP/prospero-mcp" --no-audit --no-fund
          npm run build --prefix "$RUNNER_TEMP/prospero-mcp"
          test -s "$RUNNER_TEMP/prospero-mcp/dist/cli.js"
          echo "PROSPERO_CLI_JS=$RUNNER_TEMP/prospero-mcp/dist/cli.js" >> "$GITHUB_ENV"
      - name: Check each scholarly source using one bounded PICO query
        run: python scripts/source_health.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scimed-source-health
          path: source-health.json
          if-no-files-found: warn
          retention-days: 14
