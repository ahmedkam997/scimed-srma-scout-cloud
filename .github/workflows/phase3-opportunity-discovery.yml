name: phase3-opportunity-discovery
on:
  workflow_dispatch:
  push:
    branches: [scientific-verification-v2-phase3-replay]
    paths:
      - '.github/workflows/phase3-opportunity-discovery.yml'
      - 'src/scimed_scout/discovery/rct_first.py'
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - specialty: Cardiology
            slug: cardiology
            rotation: 3
            fixed_anchors: false
          - specialty: General Surgery
            slug: general-surgery
            rotation: 1
            fixed_anchors: true
    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
      SCIMED_SPECIALTY: ${{ matrix.specialty }}
      SCIMED_ROTATION: ${{ matrix.rotation }}
      SCIMED_FIXED_ANCHORS: ${{ matrix.fixed_anchors }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - name: Discover and persist public RCT opportunity leads
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scimed_scout.discovery.rct_first import collect

          report = collect(
              os.environ["SCIMED_SPECIALTY"],
              int(os.environ["SCIMED_ROTATION"]),
              dynamic=False if os.environ["SCIMED_FIXED_ANCHORS"] == "true" else None,
          )
          Path("opportunity.json").write_text(json.dumps(report, indent=2, default=str) + "\n")
          status = report["status"]
          candidates = report["candidates"]
          lines = [
              f'Coverage: {status}. Candidate leads: {len(candidates)}.',
              'This discovery sample does not confer scientific qualification.',
          ]
          annotation = {"coverage": status, "total_candidate_leads": len(candidates), "candidates": []}
          for row in candidates:
              metadata = row["metadata"]
              counts = metadata["rct_first"]
              annotation["candidates"].append({
                  "id": row["candidate_id"], "title": row["title"],
                  "family_leads": counts["family_leads"],
                  "shortlist_eligible": counts["shortlist_eligible"],
              })
              lines.append(f'- {row["candidate_id"]}: {row["title"]} — '
                           f'{counts["family_leads"]} bibliographic family leads.')
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
          annotation["candidates"] = annotation["candidates"][:6]
          print("::notice title=Opportunity rotation::" + json.dumps(annotation).replace("%", "%25"))
          if status == "ACCESS_UNRESOLVED":
              raise SystemExit("Opportunity discovery access unresolved")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase3-opportunities-${{ matrix.slug }}
          path: opportunity.json
          retention-days: 14
