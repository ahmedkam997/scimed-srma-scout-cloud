name: phase3-opportunity-discovery
on:
  workflow_dispatch:
  push:
    branches: [scientific-verification-v2-phase3-replay]
    paths:
      - '.github/workflows/phase3-opportunity-discovery.yml'
      - 'src/scimed_scout/discovery/rct_first.py'
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - specialty: Cardiology
            slug: cardiology
            rotation: 2
          - specialty: General Surgery
            slug: general-surgery
            rotation: 0
    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
      SCIMED_SPECIALTY: ${{ matrix.specialty }}
      SCIMED_ROTATION: ${{ matrix.rotation }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - name: Discover and persist public RCT opportunity leads
        run: |
          python -m scimed_scout.discovery.rct_first --specialty "$SCIMED_SPECIALTY" --rotation "$SCIMED_ROTATION" --output opportunity.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("opportunity.json").read_text())
          status = report["status"]
          candidates = report["candidates"]
          lines = [
              f'Coverage: {status}. Candidate leads: {len(candidates)}.',
              'This discovery sample does not confer scientific qualification.',
          ]
          for row in candidates:
              metadata = row["metadata"]
              counts = metadata["rct_first"]
              lines.append(f'- {row["candidate_id"]}: {row["title"]} — '
                           f'{counts["family_leads"]} bibliographic family leads.')
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
          if status == "ACCESS_UNRESOLVED":
              raise SystemExit("Opportunity discovery access unresolved")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase3-opportunities-${{ matrix.slug }}
          path: opportunity.json
          retention-days: 14
