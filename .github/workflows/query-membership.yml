name: query-membership
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/query-membership.yml'
      - 'src/scimed_scout/discovery/query_membership_audit.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_query_membership_audit.py
      - run: python -m scimed_scout.discovery.query_membership_audit --output query-membership.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: query-membership
          path: query-membership.json
