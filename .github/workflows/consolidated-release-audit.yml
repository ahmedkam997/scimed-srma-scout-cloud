name: consolidated-release-audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidated-release-audit.yml'
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
  live-review-and-adaptive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m scimed_scout.discovery.adaptive_retrieval_benchmark --output adaptive-release.json
      - run: python -m scimed_scout.discovery.review_retrieval_audit --output review-release.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: '*-release.json'
  live-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/install_prospero_cli.sh
      - run: python -m scimed_scout.discovery.prospero_pagination_check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-release
          path: prospero-production-check.json
