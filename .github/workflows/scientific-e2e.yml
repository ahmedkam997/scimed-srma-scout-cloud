name: scientific-e2e
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/scientific-e2e.yml
permissions:
  contents: read
concurrency:
  group: scimed-scientific-e2e
  cancel-in-progress: false
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCIMED_AI_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
      SCIMED_AI_MODEL: openrouter/free
      SCIMED_AI_API_KEY: ${{ secrets.SCIMED_AI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_FREE_MODEL: gemini-3.5-flash-lite
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      PROSPERO_NETWORK_MODE: online
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_scientific_benchmark.py tests/test_scientific_e2e.py
      - run: python -m scimed_scout.discovery.end_to_end_benchmark --output scientific-e2e-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-e2e-report
          path: scientific-e2e-report.json
          retention-days: 14
