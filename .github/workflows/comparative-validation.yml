name: comparative-validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/comparative-validation.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: scimed-comparative-validation
  cancel-in-progress: false
jobs:
  paired-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SCIMED_AI_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
      SCIMED_AI_MODEL: openrouter/free
      SCIMED_AI_API_KEY: ${{ secrets.SCIMED_AI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_FREE_MODEL: gemini-3.5-flash-lite
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      PROSPERO_NETWORK_MODE: online
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_comparative_validation.py
      - name: Reuse exact previous frozen evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45622888183 -n paired-discovery-pilot -D previous-pilot --repo "$GITHUB_REPOSITORY"
        continue-on-error: true
      - run: python -m scimed_scout.discovery.comparative_validation --output comparison-report.json --deep --seed-report previous-pilot/comparison-report.json
      - name: Generate incident diagnostics
        if: always()
        run: |
          if [ -f comparison-report.json ]; then
            python -m scimed_scout.diagnostics --comparison comparison-report.json --output diagnostics-report.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-discovery-pilot
          path: |
            comparison-report.json
            diagnostics-report.json
          retention-days: 7
