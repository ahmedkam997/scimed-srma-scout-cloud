name: benchmark-repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/benchmark-repair.yml
      - src/scimed_scout/discovery/registration_enrichment.py
permissions:
  contents: read
concurrency:
  group: scimed-benchmark-repair
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_registration_enrichment.py
      - run: python -m scimed_scout.discovery.benchmark_repair --output benchmark-repair.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-repair-report
          path: benchmark-repair.json
          retention-days: 14
