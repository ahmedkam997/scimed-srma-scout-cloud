name: v2-real-family-contrast
on:
  workflow_dispatch:
  push:
    branches: [scientific-verification-v2-phase1]
    paths:
      - 'scripts/v2_real_family_contrast.py'
      - '.github/workflows/v2-real-family-contrast.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: python scripts/v2_real_family_contrast.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v2-real-family-contrast
          path: v2-real-family-contrast.json
