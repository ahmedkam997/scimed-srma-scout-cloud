name: SciMed autonomous research scheduler
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scimed-autonomous-scheduler.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: scimed-autonomous-scheduler
  cancel-in-progress: false
jobs:
  research:
    # Never execute on forks/other refs, or consume private-repository minutes.
    if: github.repository == 'ahmedkam997/scimed-srma-scout-cloud' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WORKER_REF: '2d857839b2d37036c2a9576ae09c13af2918f9d6'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.WORKER_REF }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_autonomous_worker.py
      - name: Restore verified checkpoint from previous successful scheduled cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous
          prior=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/scimed-autonomous-scheduler.yml/runs?branch=main&status=success&per_page=20" --jq '.workflow_runs[0].id // empty')
          if [[ -n "$prior" ]]; then
            [[ "$prior" =~ ^[0-9]+$ ]]
            gh run download "$prior" --repo "$GITHUB_REPOSITORY" --name scimed-autonomous-checkpoint --dir previous
          else
            # One-time bootstrap from the verified live validation run.
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/45960183461" | jq -e --arg repo "$GITHUB_REPOSITORY" --arg ref "$WORKER_REF" '.head_repository.full_name == $repo and .head_sha == $ref and .conclusion == "success"' >/dev/null
            gh run download 45960183461 --repo "$GITHUB_REPOSITORY" --name scimed-worker-validation-state --dir previous
          fi
          test -s previous/worker-state.json
          python -c 'from pathlib import Path; from scripts.scimed_autonomous_worker import load,plan; s=load(Path("previous/worker-state.json")); print("RESTORED_CYCLES",s["cycles"],"NEXT",plan(s))'
      - name: Execute bounded scientific discovery cycle
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
          SCIMED_FREE_OPENROUTER_API_KEY: ${{ secrets.SCIMED_FREE_OPENROUTER_API_KEY }}
          SCIMED_FREE_GROQ_API_KEY: ${{ secrets.SCIMED_FREE_GROQ_API_KEY }}
          SCIMED_FREE_GEMINI_API_KEY: ${{ secrets.SCIMED_FREE_GEMINI_API_KEY }}
          SCIMED_FREE_GROQ_ATTESTED: ${{ vars.SCIMED_FREE_GROQ_ATTESTED }}
          SCIMED_FREE_GEMINI_ATTESTED: ${{ vars.SCIMED_FREE_GEMINI_ATTESTED }}
        run: python -m scripts.scimed_autonomous_worker --checkpoint previous/worker-state.json --advisory
      - name: Validate checkpoint and publish bounded summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.scimed_autonomous_worker import load
          old=load(Path("previous/worker-state.json"))
          new=load(Path("worker-output/worker-state.json"))
          assert new["cycles"]==old["cycles"]+1
          assert Path("worker-output/worker-state.json").stat().st_size<=1048576
          r=json.loads(Path("worker-output/report.json").read_text())
          assert r["qualification_granted"] is False and r["first_choice_count"]==0
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f'Cycle {new["cycles"]}: {r["specialty"]}, coverage {r["coverage"]}, {len(r["candidates"])} provisional leads. No scientific qualification. Next: {r["next"]}.\n')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: scimed-autonomous-checkpoint
          path: worker-output/worker-state.json
          if-no-files-found: error
          retention-days: 14
      - name: Bound short-lived evidence artifact
        run: |
          test "$(du -b worker-output/report.json worker-output/source-evidence.json | awk '{s+=$1} END{print s}')" -le 10485760
      - uses: actions/upload-artifact@v6
        with:
          name: scimed-autonomous-evidence
          path: |
            worker-output/report.json
            worker-output/source-evidence.json
          retention-days: 3
          if-no-files-found: error
