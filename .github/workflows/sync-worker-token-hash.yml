name: sync-worker-token-hash

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-worker-token-hash.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify limited worker access to Supabase queue
        env:
          SCIMED_WORKER_TOKEN: ${{ secrets.SCIMED_WORKER_TOKEN }}
          SUPABASE_URL: https://vskqiszpjxsmcayuaclo.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZza3Fpc3pwanhzbWNheXVhY2xvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzNzY3MzQsImV4cCI6MjExMDk1MjczNH0.ussaGLgCbu_J15GCEe3VGiLuCurV65xsyEjgxoHBfHs
        run: |
          if [ -z "$SCIMED_WORKER_TOKEN" ]; then
            echo "SCIMED_WORKER_TOKEN is missing"
            exit 1
          fi
          HTTP_CODE=$(curl --silent --show-error             --output /tmp/queue.json             --write-out "%{http_code}"             -H "apikey: $SUPABASE_ANON_KEY"             -H "Authorization: Bearer $SUPABASE_ANON_KEY"             -H "x-scimed-worker-token: $SCIMED_WORKER_TOKEN"             "$SUPABASE_URL/rest/v1/discovery_jobs?select=id,status&limit=1")
          echo "SUPABASE_QUEUE_HTTP=$HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            cat /tmp/queue.json
            exit 1
          fi
          echo "WORKER_QUEUE_ACCESS=OK"
