name: scientific-validation-v2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/scimed_scout/discovery/scientific_validation_v2.py'
      - 'src/scimed_scout/discovery/rct_first.py'
      - 'benchmarks/scientific_validation_v2.json'
      - '.github/workflows/scientific-validation-v2.yml'
permissions:
  contents: read
jobs:
  reference-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m scimed_scout.discovery.scientific_validation_v2 --output scientific-validation-v2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-validation-v2
          path: scientific-validation-v2.json
