name: historical-retrieval-validation
on:
  workflow_dispatch:
  push:
    branches: [main, bounded-stratified-retrieval-and-linkage]
    paths:
      - 'scripts/historical_retrieval_validation.py'
      - 'src/scimed_scout/discovery/stratified_retrieval.py'
      - '.github/workflows/historical-retrieval-validation.yml'
permissions:
  contents: read
jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/historical_retrieval_validation.py --output historical-retrieval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-retrieval
          path: historical-retrieval.json
