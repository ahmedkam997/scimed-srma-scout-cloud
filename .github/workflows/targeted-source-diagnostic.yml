name: targeted-source-diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/targeted-source-diagnostic.yml'
      - 'src/scimed_scout/discovery/targeted_source_diagnostic.py'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROSPERO_NETWORK_MODE: online
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned PROSPERO-MCP read-only CLI
        run: |
          bash scripts/install_prospero_cli.sh
      - run: python -m pytest -q tests/test_targeted_source_diagnostic.py
      - run: python -m scimed_scout.discovery.targeted_source_diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-source-report
          path: targeted-source-report.json
          retention-days: 14
