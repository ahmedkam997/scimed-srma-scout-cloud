name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m scimed_scout.discovery.benchmark --output benchmark-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-benchmark-report
          path: benchmark-report.json
      - run: node --check web/app.js
      - run: node --check web/opportunity-assessment.js
      - run: node --test tests/web_opportunity_assessment.mjs
      - run: node --check web/gap-verification.js
      - run: node --check web/final-audit-evidence.js
      - run: node --check web/final-evidence-audit.js
      - run: node --check web/sw.js
      - run: node --test tests/web_legacy_dedup.mjs
      - run: node --test tests/web_topic_transfer.mjs
      - run: node --test tests/web_report_loading.mjs
      - run: node --test tests/web_rct_resume.mjs
      - run: node --test tests/web_gap_verification.mjs
      - run: node --test tests/web_cloud_gap_sync.mjs
      - run: node --test tests/web_targeted_source_recheck.mjs
      - run: node --test tests/web_recheck_dispatch.mjs
      - run: node --test tests/web_final_evidence_audit.mjs
      - run: node --test tests/web_final_evidence_dta.mjs
      - run: node --test tests/web_startup_reconnect.mjs
      - run: scimed-scout health
