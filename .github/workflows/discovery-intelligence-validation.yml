name: discovery-intelligence-validation
on:
  pull_request:
    branches: [autonomous-scientist-v10]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discovery-intelligence-validation
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_discovery_intelligence.py tests/test_autonomous_worker.py tests/test_autonomous_worker_v2.py tests/test_autonomous_scientist.py tests/test_scientific_verification_v2.py
      - name: Compare live dynamic versus curated discovery on same cardiology rotation
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import scimed_autonomous_worker as w
          from scimed_scout.discovery.rct_first import collect
          from scripts.scimed_autonomous_worker_v2 import seed_jobs,extend
          result={}
          for mode,retries in (("dynamic",0),("curated",1)):
              state=w.initial()
              state["retries"]=retries
              report,raw=w.run(state,collect,w.triage_public)
              seed_jobs(state,raw)
              assert report["discovery_mode"]==mode and not report["qualification_granted"]
              summary={"coverage":report["coverage"],"dynamic_anchors":raw.get("dynamic_discovery",{}),"candidates":[{"id":x["id"],"title":x["title"],"family_leads":x["family_leads"],"shortlist_cue":x["shortlist_cue"]} for x in report["candidates"]],"early_leads_in_queue":sum(not state["ledger"][cid]["shortlist_cue"] for cid in extend(state)["jobs"]),"qualification_granted":False}
              result[mode]=summary
              Path(mode+".json").write_text(json.dumps(raw,indent=2,default=str))
              print("DISCOVERY_COMPARISON",mode,json.dumps(summary,default=str),flush=True)
          result["new_dynamic_candidate_ids"]=sorted({x["id"] for x in result["dynamic"]["candidates"]}-{x["id"] for x in result["curated"]["candidates"]})
          print("DISCOVERY_DELTA",json.dumps(result["new_dynamic_candidate_ids"]),flush=True)
          Path("comparison.json").write_text(json.dumps(result,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: discovery-intelligence-comparison
          path: |
            dynamic.json
            curated.json
            comparison.json
          retention-days: 7
