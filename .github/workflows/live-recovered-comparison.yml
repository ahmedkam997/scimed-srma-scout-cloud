name: live-recovered-comparison-control
on:
  pull_request:
    branches: [autonomous-scientist-v10]
    paths:
      - '.github/workflows/live-recovered-comparison.yml'
      - 'src/scimed_scout/discovery/rct_first.py'
      - 'tests/test_discovery_intelligence.py'
      - 'scripts/scimed_autonomous_worker_v2.py'
      - 'scripts/phase3_family_methods.py'
      - 'src/scimed_scout/sources/pubmed_abstracts.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-recovered-comparison-control
  cancel-in-progress: false
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Retrieve actual DELIVER primary and secondary reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.scimed_autonomous_worker_v2 import fetch_rows,audit_recovered_comparisons
          from scimed_scout.sources.pubmed import PubMedSource
          from scimed_scout.discovery.trial_family import audit_trial_families
          ids=["36027570","36054231"]
          found,diag=fetch_rows(PubMedSource(),ids)
          scope={"population":"heart failure","intervention":"dapagliflozin","comparator":"placebo"}
          audit=audit_recovered_comparisons(scope,found,ids)
          result={"requested":ids,"retrieved":sorted(found),"publication_years":{p:r["payload"]["year"] for p,r in found.items()},"comparison_audit":audit,"family_audit":audit_trial_families(list(found.values())),"diagnostics":diag,"qualification_granted":False}
          Path("live-recovered-comparison.json").write_text(json.dumps(result,indent=2,default=str))
          print("LIVE_RECOVERED_COMPARISON",json.dumps(result,default=str),flush=True)
          assert set(found)==set(ids), "Exact source retrieval incomplete"
          assert all(r["payload"]["year"]==2022 for r in found.values()), "Publication year missing"
          assert audit["source_pmids"]==["36027570"], "Primary/secondary comparison cue mismatch"
          assert audit["family_leads"]==1 and not audit["shortlist_signal"]
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: live-recovered-comparison
          path: live-recovered-comparison.json
          retention-days: 14
