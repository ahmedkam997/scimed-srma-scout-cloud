name: trigger-scimed-recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-scimed-recovery.yml'

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing discovery worker at current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run discovery-worker.yml --ref main
