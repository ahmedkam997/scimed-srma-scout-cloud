name: evidence-first-smoke
on:
  workflow_dispatch:
  push:
    paths:
      - src/scimed_scout/discovery/evidence_first.py
      - .github/workflows/evidence-first-smoke.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m scimed_scout.discovery.evidence_first --output evidence-map.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-first-live-map
          path: evidence-map.json
