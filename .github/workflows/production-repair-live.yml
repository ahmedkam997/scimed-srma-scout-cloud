name: production-repair-live
on:
  workflow_dispatch:
  push:
    branches: [scientific-adjudication-recovery-v1]
    paths:
      - 'scripts/production_repair_live.py'
      - '.github/workflows/production-repair-live.yml'
permissions:
  contents: read
jobs:
  source-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROSPERO_NETWORK_MODE: online
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - run: python -m pip install -e .
      - run: bash scripts/install_prospero_cli.sh
        continue-on-error: true
      - run: python scripts/production_repair_live.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: production-repair-live
          path: production-repair-live.json
