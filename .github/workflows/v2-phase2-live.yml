name: v2-phase2-real-source-challenge
on:
  workflow_dispatch:
  push:
    branches: [scientific-verification-v2-phase1]
    paths:
      - 'scripts/v2_phase2_live.py'
      - 'src/scimed_scout/discovery/structured_extraction_v2.py'
      - 'src/scimed_scout/discovery/competitor_priority_v2.py'
      - '.github/workflows/v2-phase2-live.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: python scripts/v2_phase2_live.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v2-phase2-live
          path: v2-phase2-live.json
