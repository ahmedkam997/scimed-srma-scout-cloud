name: v2-aviary-research-gym
on:
  workflow_dispatch:
  push:
    branches: [scientific-verification-v2-phase3-replay]
    paths:
      - 'scripts/v2_aviary_gym.py'
      - 'tests/test_aviary_gym.py'
      - '.github/workflows/v2-aviary-research-gym.yml'
  pull_request:
    branches: [scientific-verification-v2-phase1]
    paths:
      - 'scripts/v2_aviary_gym.py'
      - 'tests/test_aviary_gym.py'
      - '.github/workflows/v2-aviary-research-gym.yml'
permissions:
  contents: read
jobs:
  gym:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]' 'fhaviary==0.37.0'
      - run: python -m pytest -q tests/test_aviary_gym.py
      - run: python -m scripts.v2_aviary_gym
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: aviary-gym-report
          path: aviary-gym-report.json
