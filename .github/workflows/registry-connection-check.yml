name: registry-connection-check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/registry-connection-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Inspect OSF Trove registration metadata search
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.parse
          BASE="https://share.osf.io/trove/index-card-search"
          cases=[
            {"cardSearchText[title,description]":"heart failure","page[size]":3,"acceptMediatype":"application/vnd.api+json"},
            {"cardSearchText":"heart failure","cardSearchFilter[resourceType]":"Registration","page[size]":3,"acceptMediatype":"application/vnd.api+json"},
            {"cardSearchText[title,description]":"heart failure","cardSearchFilter[resourceType]":"Registration","page[size]":3,"acceptMediatype":"application/vnd.api+json"},
            {"cardSearchText[title,description]":"heart failure","cardSearchFilter[resourceType]":"https://osf.io/vocab/2022/Registration","page[size]":3,"acceptMediatype":"application/vnd.api+json"},
          ]
          for params in cases:
            url=BASE+"?"+urllib.parse.urlencode(params)
            try:
              req=urllib.request.Request(url,headers={"Accept":"application/vnd.api+json"})
              with urllib.request.urlopen(req,timeout=12) as res: data=json.loads(res.read())
              items=data.get("data",[])
              print("CASE",list(params.keys()),"filter",params.get("cardSearchFilter[resourceType]"),"COUNT",len(items),"NEXT",bool(data.get("links",{}).get("next")),"META",str(data.get("meta"))[:100])
              for item in items[:2]:
                attrs=item.get("attributes",{})
                print("FIRST",item.get("type"),str(item.get("id"))[:90],"ATTR",list(attrs.keys())[:10],"TITLE",str(attrs.get("resourceMetadata",{}).get("title",""))[:110],"META_TYPE",str(attrs.get("resourceMetadata",{}).get("@type",""))[:100])
            except Exception as exc:
              print("ERROR",type(exc).__name__,str(exc)[:190])
          PY
