name: registry-connection-check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/registry-connection-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe pinned CLI package install and environment
        run: |
          set +e
          npm install -g --no-audit --no-fund github:erichuang777777/PROSPERO-MCP#v0.2.2 > /tmp/npm-install.out 2>&1
          echo "NPM_EXIT=$?"
          tail -c 450 /tmp/npm-install.out
          echo "NPM_ROOT=$(npm root -g)"
          echo "NPM_PREFIX=$(npm prefix -g)"
          ls -la "$(npm root -g)/prospero-mcp/dist/" 2>&1 | head -c 500
          ls -la "$(npm prefix -g)/bin/" 2>&1 | grep -E 'prospero|^total' | head
          command -v prospero || true
      - name: Probe PROSPERO using installed dist directly
        env:
          PROSPERO_NETWORK_MODE: online
        run: |
          set +e
          FILE="$(npm root -g)/prospero-mcp/dist/cli.js"
          if [ -f "$FILE" ]; then
            timeout 25s node "$FILE" health > /tmp/health 2>&1
            echo "HEALTH=$?"; head -c 650 /tmp/health; echo
            timeout 35s node "$FILE" search "heart failure" --page-size 3 > /tmp/search 2>&1
            echo "SEARCH=$?"; head -c 1500 /tmp/search; echo
          else
            echo "CLI_DIST_MISSING"
          fi
      - name: OSF API public title filter semantics and pagination
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request
          for q in ('heart failure','heart'):
            params={'filter[title]':q,'page[size]':3}
            url='https://api.osf.io/v2/registrations/?'+urllib.parse.urlencode(params)
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'SciMed-Reg-Checker/1.0','Accept':'application/json'})
              with urllib.request.urlopen(request,timeout=18) as res:
                raw=res.read()
              data=json.loads(raw)
              print('OSF',q,'BYTES',len(raw),'COUNT',len(data.get('data',[])),'NEXT',bool(data.get('links',{}).get('next')),'TOTAL',data.get('meta',{}).get('total'),flush=True)
              for r in data.get('data',[])[:2]:
                print('TYPE',r.get('type'),'TITLE',str(r.get('attributes',{}).get('title',''))[:100])
            except Exception as exc:
              print('OSF',q,'ERROR',type(exc).__name__,str(exc)[:200],flush=True)
          PY
