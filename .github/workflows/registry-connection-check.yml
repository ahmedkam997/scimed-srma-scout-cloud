name: registry-connection-check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/registry-connection-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SciMed Python adapter
        run: python -m pip install -e .
      - name: Build pinned PROSPERO v0.2.2 source
        run: |
          git clone --quiet --depth 1 --branch v0.2.2 https://github.com/erichuang777777/PROSPERO-MCP.git "$RUNNER_TEMP/prospero-mcp"
          npm install --prefix "$RUNNER_TEMP/prospero-mcp" --no-audit --no-fund
          npm run build --prefix "$RUNNER_TEMP/prospero-mcp"
          test -s "$RUNNER_TEMP/prospero-mcp/dist/cli.js"
          echo "PROSPERO_CLI_JS=$RUNNER_TEMP/prospero-mcp/dist/cli.js" >> "$GITHUB_ENV"
      - name: Test live SciMed registry adapters with public queries
        env:
          PROSPERO_NETWORK_MODE: online
        run: |
          python - <<'PY'
          from scimed_scout.sources.prospero import ProsperoCliSource
          from scimed_scout.sources.osf import OSFRegistrationsSource
          from scimed_scout.domain import SourceStatus
          for source in (ProsperoCliSource(max_pages=1),OSFRegistrationsSource(max_pages=1)):
            result=source.search("heart failure",limit=3)
            print("REGISTRY",source.name,"STATUS",result.status.value,"MATCHES",len(result.records),"TOTAL",result.total_count,"INFO",result.message[:200],flush=True)
            assert result.status != SourceStatus.ACCESS_FAILED, f"{source.name}: access failed"
            assert len(result.records) >= 1, f"{source.name}: no test results"
            assert result.status == SourceStatus.PARTIAL, "Broad sample must not be marked as exhaustive"
          print("REGISTRY_LIVE_TEST_PASS")
          PY
