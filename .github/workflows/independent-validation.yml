name: independent-validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/independent-validation.yml']
permissions:
  contents: read
concurrency:
  group: scimed-independent-validation
  cancel-in-progress: false
jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: python scripts/external_reference_validation.py --output independent-reference.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-reference
          path: independent-reference.json
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      PROSPERO_NETWORK_MODE: online
      SCIMED_AI_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
      SCIMED_AI_MODEL: openrouter/free
      SCIMED_AI_API_KEY: ${{ secrets.SCIMED_AI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_FREE_MODEL: gemini-3.5-flash-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -e .
      - run: bash scripts/install_prospero_cli.sh
        continue-on-error: true
      - run: python scripts/provider_health_once.py
      - run: python scripts/source_health.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-health
          path: |
            source-health.json
            provider-health.json
  production-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/production_resume_canary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-resume-canary
          path: production-resume-canary.json
