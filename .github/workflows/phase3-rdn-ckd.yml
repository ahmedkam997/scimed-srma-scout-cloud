name: phase3-rdn-ckd
on:
  workflow_dispatch:
  push:
    branches: [scientific-verification-v2-phase3-replay]
    paths:
      - '.github/workflows/phase3-rdn-ckd.yml'
      - 'scripts/phase3_rdn_ckd.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: python -m scripts.phase3_rdn_ckd
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase3-rdn-ckd
          path: phase3-rdn-ckd.json
          retention-days: 14
