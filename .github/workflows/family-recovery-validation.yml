name: family-recovery-validation
on:
  workflow_dispatch:
  push:
    branches: [main, bounded-stratified-retrieval-and-linkage]
    paths:
      - 'scripts/external_family_linkage.py'
      - '.github/workflows/family-recovery-validation.yml'
permissions:
  contents: read
jobs:
  family:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SCIMED_CONTACT_EMAIL: ${{ secrets.SCIMED_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/external_family_linkage.py --output family-recovery.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-recovery
          path: family-recovery.json
