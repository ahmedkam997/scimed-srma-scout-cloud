name: v2-phase2-followup
on:
  push:
    branches: [scientific-verification-v2-phase1]
    paths: ['scripts/v2_phase2_followup.py','.github/workflows/v2-phase2-followup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: python scripts/v2_phase2_followup.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v2-phase2-followup
          path: v2-phase2-followup.json
